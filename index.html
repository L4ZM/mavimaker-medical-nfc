<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14213d"><title>MaviMaker Medical NFC</title><style>body{margin:0;background:#eef2f7;color:#17243a;font-family:system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}header{background:#14213d;color:white;padding:28px 20px;border-radius:0 0 24px 24px}.brand{font-size:27px;font-weight:900;font-style:italic}.card{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 20px #14213d13}h1{font-size:25px;margin:10px 0}h2{font-size:16px;margin:0 0 10px}.blood{background:#bf263d;color:white;font-weight:800;font-size:26px;padding:12px 16px;border-radius:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#64748b;font-size:13px}.btn{display:inline-block;background:#176b5b;color:white;padding:12px;border-radius:11px;text-decoration:none;font-weight:700;margin:5px 6px 0 0}.btn.call{background:#19559b}select{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:10px;font-size:16px}p{line-height:1.55}.warning{background:#fff2d9;padding:12px;border-radius:10px;color:#694800}</style></head><body><header><div class="wrap"><div class="brand">MaviMaker</div><div>MEDICAL NFC · Perfil de emergencia</div></div></header><main class="wrap"><div class="card"><label for="profiles"><strong>Seleccionar ficha de demostración</strong></label><p class="muted">Cada perfil puede abrirse con ?id=demo-01 a ?id=demo-06.</p><select id="profiles"></select></div><section id="profile"></section><p class="muted">MaviMaker · Creando emociones · Prototipo sin información médica real.</p></main><script>
const people=[["Ana Martínez","O+","Polen, polvo","Sinusitis","Tratamiento de ejemplo","9980000101"],["Carlos Rivera","A+","No registradas","Sin diagnósticos registrados","No registrado","9980000102"],["Sofía López","B+","Antibiótico de ejemplo","Condición de ejemplo","Tratamiento ficticio","9980000103"],["Elena Gómez","O+","No registradas","Artritis","Tratamiento ficticio","9980000104"],["Roberto Sánchez","AB+","No registradas","Hipertensión","Tratamiento ficticio","9980000105"],["Diego Torres","O+","Medicamento de ejemplo","Condición de ejemplo","No registrado","9980000106"]];
const select=document.getElementById('profiles'),out=document.getElementById('profile');
people.forEach((p,i)=>{const o=document.createElement('option');o.value='demo-'+String(i+1).padStart(2,'0');o.textContent=p[0];select.append(o)});
const id=new URLSearchParams(location.search).get('id');const direct=[...select.options].some(o=>o.value===id);if(direct){select.value=id;select.closest('.card').hidden=true;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const p=people[select.selectedIndex],phone=p[5];out.innerHTML='<div class="card"><div class="top"><div><span class="muted">FICHA MÉDICA · DEMOSTRACIÓN</span><h1>'+esc(p[0])+'</h1></div><div class="blood">'+esc(p[1])+'</div></div><p class="warning"><strong>DATOS FICTICIOS.</strong> No usar para atención médica.</p></div><div class="card"><h2>⚠️ Alergias</h2><p>'+esc(p[2])+'</p></div><div class="card"><h2>Diagnósticos</h2><p>'+esc(p[3])+'</p></div><div class="card"><h2>Medicamentos</h2><p>'+esc(p[4])+'</p></div><div class="card"><h2>Contacto de emergencia (ficticio)</h2><p>'+esc(phone)+'</p><a class="btn call" href="tel:+'+phone+'">Llamar</a><a class="btn" href="https://wa.me/52'+phone+'" target="_blank" rel="noopener">WhatsApp</a></div>';history.replaceState(null,'','?id='+select.value)}
select.addEventListener('change',render);render();
</script></body></html>
