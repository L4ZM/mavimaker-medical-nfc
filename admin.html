<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MaviMaker | Administración Medical NFC</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#161616;background:#f5f5f5}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:25px;margin-bottom:20px;box-shadow:0 5px 20px #00000008}.auth{max-width:480px;margin:6vh auto}h1{margin:0;font-size:30px}h2{font-size:21px;margin:0 0 15px}p{color:#555;line-height:1.5}label{display:block;margin:12px 0 5px;font-size:13px;font-weight:700}input,select,textarea{font:inherit;width:100%;border:1px solid #bbb;border-radius:8px;padding:10px;background:#fff}textarea{min-height:70px}button{background:#111;color:white;border:1px solid #111;border-radius:9px;padding:11px 16px;font-weight:650;cursor:pointer}button:disabled{opacity:.5}button.alt{background:#fff;color:#111}button.danger{background:#a52a2a;border-color:#a52a2a}button+button{margin-left:7px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.hidden{display:none!important}.status{min-height:22px;color:#9a2929;overflow-wrap:anywhere}.muted{font-size:13px;color:#666}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 18px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{margin:0}.patients{display:grid;gap:10px}.patient{border:1px solid #ddd;border-radius:12px;padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:center}.patient strong{display:block}.patient small{color:#666}.pill{display:inline-block;border-radius:15px;background:#e5f7e8;color:#17612b;padding:4px 9px;font-size:12px}.pill.off{background:#fbe9e9;color:#9a2929}.full{grid-column:1/-1}dialog{border:0;border-radius:16px;padding:0;width:min(95vw,750px);max-height:90vh;box-shadow:0 20px 80px #0005}dialog::backdrop{background:#0008}dialog .card{margin:0;border:0}a{color:#111;overflow-wrap:anywhere}#search{max-width:450px}@media(max-width:650px){.grid{grid-template-columns:1fr}.patient{display:block}.patient .actions{margin-top:10px}header{display:block}.row>*{flex-basis:100%}}
</style></head><body><div class="wrap">
<header><div><h1>MaviMaker</h1><p>Medical NFC · Administración privada</p></div><button id="logout" class="alt hidden">Cerrar sesión</button></header>
<section id="setup" class="card auth"><h2>Configurar conexión</h2><p>Introduce la clave pública <strong>sb_publishable_…</strong> de Supabase. Nunca uses una clave secreta.</p><label>Publishable key</label><input id="key" type="password" autocomplete="off"><button id="saveKey" style="margin-top:15px">Guardar configuración</button></section>
<section id="login" class="card auth hidden"><h2>Iniciar sesión</h2><label>Correo</label><input id="email" type="email" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><div class="actions" style="margin-top:15px"><button id="signin">Entrar</button><button id="changeKey" class="alt">Cambiar clave pública</button></div></section>
<section id="app" class="hidden"><div class="card"><div class="row"><div><h2>Pacientes</h2><p id="count" class="muted"></p></div><div class="actions"><button id="add">+ Nuevo paciente</button><button id="refresh" class="alt">Actualizar</button></div></div><label for="search">Buscar paciente</label><input id="search" placeholder="Nombre del paciente"><p class="muted">Los datos médicos son privados. Evita compartir enlaces NFC públicamente.</p><div id="patients" class="patients"></div></div></section>
<p id="status" class="status" role="status" aria-live="polite"></p></div>
<dialog id="editor"><div class="card"><h2 id="editorTitle">Paciente</h2><form id="form"><div class="grid" id="fields"></div><div class="actions" style="margin-top:18px"><button type="submit" id="submit">Guardar paciente</button><button type="button" id="cancel" class="alt">Cancelar</button></div></form><p id="formStatus" class="status"></p></div></dialog>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const PROJECT='https://tcdaiaaxajppbcpynivw.supabase.co', API=PROJECT+'/functions/v1/admin-patients', SITE='https://l4zm.github.io/mavimaker-medical-nfc/nfc.html#token=';
const $=id=>document.getElementById(id), specs=[['full_name','Nombre completo','text',true],['date_of_birth','Fecha de nacimiento','date',true],['birth_place','Lugar de nacimiento'],['residence_city','Ciudad de residencia'],['blood_type','Tipo de sangre'],['allergies','Alergias','textarea'],['medical_conditions','Enfermedades o condiciones','textarea'],['medications','Medicamentos','textarea'],['imss_number','Número IMSS'],['emergency_contact_name','Contacto de emergencia'],['emergency_contact_phone','Teléfono de emergencia','tel'],['emergency_contact_preference','Preferencia de contacto']];
let client=null,patients=[],editing=null;
function show(id){for(const s of ['setup','login','app'])$(s).classList.toggle('hidden',s!==id);$('logout').classList.toggle('hidden',id!=='app');status('')}
function status(msg){$('status').textContent=msg||''}
function formStatus(msg){$('formStatus').textContent=msg||''}
function init(){const key=sessionStorage.getItem('mavi_public_key');if(!key){show('setup');return}client=createClient(PROJECT,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});show('login');check()}
async function check(){const {data:{user},error}=await client.auth.getUser();if(error||!user)return;const {data,error:err}=await client.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(err||!data){await client.auth.signOut();show('login');status('Esta cuenta no tiene autorización administrativa.');return}show('app');await load()}
async function request(method='GET',payload){const {data:{session}}=await client.auth.getSession();if(!session)throw Error('Sesión caducada: vuelve a iniciar sesión');const res=await fetch(API,{method,headers:{'Authorization':'Bearer '+session.access_token,'apikey':sessionStorage.getItem('mavi_public_key'),'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined,cache:'no-store'});let result;try{result=await res.json()}catch{throw Error('Respuesta inválida. Comprueba que admin-patients esté desplegada.')}if(!res.ok||!result.success)throw Error(result.error||'Error '+res.status);return result}
async function load(){status('Cargando pacientes...');try{patients=(await request()).patients||[];render();status('')}catch(e){status(e.message)}}
function render(){const term=$('search').value.trim().toLocaleLowerCase('es');const list=patients.filter(p=>(p.full_name||'').toLocaleLowerCase('es').includes(term));$('count').textContent=patients.length+' expedientes registrados';const root=$('patients');root.replaceChildren();if(!list.length){const p=document.createElement('p');p.textContent='No se encontraron pacientes.';root.append(p)}for(const p of list){const item=document.createElement('div');item.className='patient';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=p.full_name||'Sin nombre';const sub=document.createElement('small');sub.textContent=(p.date_of_birth||'Sin fecha')+' · ';const badge=document.createElement('span');badge.className='pill'+(p.is_active?'':' off');badge.textContent=p.is_active?'Activo':'Inactivo';info.append(name,sub,badge);const actions=document.createElement('div');actions.className='actions';function btn(label,fn,cls='alt'){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;actions.append(b)}btn('Editar',()=>openEditor(p));if(p.is_active&&p.access_token){btn('Copiar enlace',async()=>{const link=SITE+encodeURIComponent(p.access_token);try{await navigator.clipboard.writeText(link);status('Enlace copiado. Compártelo solo con autorización.')}catch{prompt('Copia el enlace NFC:',link)}});btn('Desactivar',()=>action(p,'revoke'),'danger')}else{btn('Nuevo NFC',()=>action(p,'rotate'))}item.append(info,actions);root.append(item)}}
function openEditor(p=null){editing=p?.id||null;$('editorTitle').textContent=p?'Editar paciente':'Nuevo paciente';const root=$('fields');root.replaceChildren();for(const [key,label,type='text',required=false] of specs){const wrap=document.createElement('div');if(type==='textarea')wrap.className='full';const l=document.createElement('label');l.textContent=label;l.htmlFor='f_'+key;const input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.id='f_'+key;input.name=key;input.required=required;input.value=p?.[key]||'';wrap.append(l,input);root.append(wrap)}formStatus('');$('editor').showModal()}
async function action(p,action){const question=action==='revoke'?'¿Desactivar este enlace NFC? Dejará de funcionar inmediatamente.':'¿Generar un nuevo enlace NFC? El anterior no volverá a funcionar.';if(!confirm(question))return;try{await request('PATCH',{id:p.id,action});await load();status(action==='revoke'?'Enlace desactivado.':'Nuevo enlace generado. Debes regrabar el NFC.')}catch(e){status(e.message)}}
$('form').onsubmit=async e=>{e.preventDefault();const btn=$('submit');btn.disabled=true;formStatus('Guardando...');const body={};for(const [key] of specs)body[key]=$('f_'+key).value.trim()||null;try{await request(editing?'PATCH':'POST',editing?{id:editing,...body}:body);$('editor').close();await load();status(editing?'Expediente actualizado.':'Paciente registrado correctamente.')}catch(err){formStatus(err.message)}finally{btn.disabled=false}};
$('saveKey').onclick=()=>{const key=$('key').value.trim();if(!key.startsWith('sb_publishable_'))return status('Introduce una publishable key válida.');sessionStorage.setItem('mavi_public_key',key);$('key').value='';init()};
$('signin').onclick=async()=>{const btn=$('signin');btn.disabled=true;try{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error)throw Error('Correo o contraseña incorrectos.');await check()}catch(e){status(e.message)}finally{btn.disabled=false}};
$('logout').onclick=async()=>{await client.auth.signOut();show('login')};$('changeKey').onclick=async()=>{await client.auth.signOut();sessionStorage.removeItem('mavi_public_key');client=null;show('setup')};$('add').onclick=()=>openEditor();$('refresh').onclick=load;$('search').oninput=render;$('cancel').onclick=()=>$('editor').close();init();
</script></body></html>
