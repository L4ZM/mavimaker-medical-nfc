<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MaviMaker Medical NFC · Ficha</title><style>body{margin:0;background:#edf2f7;color:#17243a;font:17px system-ui,sans-serif}header{background:#14213d;color:#fff;padding:25px max(20px,calc((100vw - 760px)/2))}.brand{font-size:30px;font-weight:900;font-style:italic}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 6px 20px #14213d12}h1{font-size:27px}h2{font-size:18px}.blood{background:#bd2440;color:#fff;padding:12px 16px;border-radius:13px;font-size:24px;font-weight:800}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.muted{font-size:13px;color:#64748b}.warning{background:#fff2d9;padding:12px;border-radius:10px}.btn{display:inline-block;padding:12px 16px;background:#18685a;color:white;border-radius:10px;text-decoration:none;margin:5px 8px 0 0;font-weight:700}.call{background:#19559b}p{line-height:1.55;overflow-wrap:anywhere}</style></head><body><header><div class="brand">MaviMaker</div>MEDICAL NFC · Perfil de emergencia</header><main class="wrap"><section id="result"><div class="card">Cargando ficha…</div></section><p class="muted">MaviMaker · Creando emociones. Esta información no sustituye la valoración médica.</p></main><script>
const result=document.getElementById('result');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(label,value)=>'<div class="card"><h2>'+esc(label)+'</h2><p>'+esc(value||'No registrado')+'</p></div>';
(async()=>{
 const token=new URLSearchParams(location.hash.substring(1)).get('token');
 if(!token||!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(token)){result.innerHTML='<div class="card"><h1>Enlace incompleto</h1><p>Esta ficha requiere el identificador NFC después de #token=.</p></div>';return}
 try{
  const url='https://tcdaiaaxajppbcpynivw.supabase.co/functions/v1/medical-profile?token='+encodeURIComponent(token);
  const res=await fetch(url,{cache:'no-store',referrerPolicy:'no-referrer'});
  const data=await res.json();
  if(!res.ok||!data.success||!data.profile)throw Error('No se pudo consultar la ficha');
  const p=data.profile,phone=String(p.emergency_contact_phone||'').replace(/\D/g,'');
  const callable=/^\d{10,15}$/.test(phone)&&!/^0+$/.test(phone);
  const buttons=callable?'<a class="btn call" href="tel:'+phone+'">Llamar</a><a class="btn" target="_blank" rel="noopener noreferrer" href="https://wa.me/'+(phone.length===10?'52':'')+phone+'">WhatsApp</a>':'';
  result.innerHTML='<div class="card"><div class="top"><div><span class="muted">FICHA MÉDICA</span><h1>'+esc(p.full_name)+'</h1></div><div class="blood">'+esc(p.blood_type||'—')+'</div></div><p class="warning">Información declarada por el titular; confirmar con profesionales de salud.</p></div>'+field('Fecha de nacimiento',p.date_of_birth)+field('⚠️ Alergias',p.allergies)+field('Condiciones médicas',p.medical_conditions)+field('Medicamentos',p.medications)+field('IMSS',p.imss_number)+'<div class="card"><h2>Contacto de emergencia</h2><p>'+esc(p.emergency_contact_name)+'</p><p>'+esc(p.emergency_contact_phone)+'</p>'+buttons+'</div>';
 }catch(e){result.innerHTML='<div class="card"><h1>No se pudo consultar la ficha</h1><p>Comprueba tu conexión o solicita un enlace actualizado.</p></div>'}
})();
</script></body></html>
